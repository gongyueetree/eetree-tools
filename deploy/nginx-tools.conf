# ============================================================
# 把工具箱挂到 https://www.eetree.cn/tools/  —— 二选一
# 构建时必须设置：BASE_PATH=/tools/  SITE_URL=https://www.eetree.cn/tools
# ============================================================

# ---- 方案 A（推荐，国内访问最快）：静态文件直接放在 eetree.cn 服务器 ----
# 本地或 CI 执行： BASE_PATH=/tools/ SITE_URL=https://www.eetree.cn/tools node scripts/build.mjs
# 然后把 dist/ 上传到服务器，例如 /var/www/eetree-tools/
location = /tools { return 301 /tools/; }
location /tools/ {
    alias /var/www/eetree-tools/;
    index index.html;
    try_files $uri $uri/ $uri/index.html =404;
    location ~* \.(js|css|svg|kicad_sch)$ { expires 7d; add_header Cache-Control "public"; }
}

# ---- 方案 B：反向代理到 Vercel（Vercel 项目里设置环境变量 BASE_PATH=/tools/ 后重新部署）----
# location = /tools { return 301 /tools/; }
# location /tools/ {
#     proxy_pass https://你的项目.vercel.app/;      # 末尾的 / 会去掉 /tools 前缀
#     proxy_set_header Host 你的项目.vercel.app;
#     proxy_ssl_server_name on;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# }

# DDS 专题旧地址
location = /dds { return 301 /tools/dds/; }
include /etc/nginx/snippets/eetree-tools-redirects.conf;   # 即 deploy/nginx-redirects.conf
